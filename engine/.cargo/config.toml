# Static C runtime, to match the C/CUDA kernel library (/MT) and to ship one self-contained rope.exe.
# No target-cpu flag: rope.exe must start on old laptops without AVX2 (kernels choose their path at run time, P2.2.5).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
